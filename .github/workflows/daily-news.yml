name: Publish Tech News

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/archive/**"
      - ".github/workflows/daily-news.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Promote latest archive to home
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          archives = sorted(Path("docs/archive").glob("*.html"))
          if not archives:
              raise SystemExit("Nessun archivio trovato")

          latest = archives[-1]
          html = latest.read_text(encoding="utf-8")
          html = html.replace("../favicon.png", "favicon.png")
          html = re.sub(
              r'<nav class="archive">.*?</nav>',
              f'<nav class="archive"><a href="archive/{latest.name}">Archivio {latest.stem}</a></nav>',
              html,
              flags=re.S,
          )
          Path("docs/index.html").write_text(html, encoding="utf-8")
          print(f"Promosso {latest} -> docs/index.html per il deploy")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
