name: Publish Tech News

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/archive/**"
      - ".github/workflows/daily-news.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Promote latest archive to home
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          archives = sorted(Path("docs/archive").glob("????-??-??.html"))
          if not archives:
              raise SystemExit("Nessun archivio trovato")

          latest = archives[-1]
          html = latest.read_text(encoding="utf-8")
          html = html.replace("../favicon.png", "favicon.png")

          links = " · ".join(
              f'<a href="archive/{item.name}">{item.stem}</a>'
              for item in reversed(archives[-10:])
          )
          nav = (
              '<nav class="archive" aria-label="Edizioni recenti">'
              f'<strong>Archivio:</strong> {links}</nav>'
          )
          html, matches = re.subn(
              r'<nav\b[^>]*>.*?</nav>',
              lambda match: nav,
              html,
              count=1,
              flags=re.S | re.I,
          )
          if not matches:
              if "</body>" not in html:
                  raise SystemExit("Archivio HTML privo di </body>")
              html = html.replace("</body>", nav + "</body>", 1)

          Path("docs/index.html").write_text(html, encoding="utf-8")
          print(f"Promosso {latest} -> docs/index.html")
          PY

      - name: Commit homepage to repository
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "docs/index.html è già aggiornata"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Update Tech News homepage from latest archive [skip ci]"
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
